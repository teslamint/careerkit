<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JD Console</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme.js"></script>
</head>
<body>
  <header><h1>JD Console</h1><p>공고 ID와 상태로 로컬 기록을 찾습니다.</p><button id="theme-toggle" type="button" aria-label="테마 전환">◐</button></header>
  <main>
    <section class="search-panel" aria-labelledby="search-heading">
      <h2 id="search-heading">검색</h2>
      <form id="search-form">
        <label for="job-id">공고 ID</label>
        <input id="job-id" name="job_id" inputmode="numeric" autocomplete="off">
        <label for="platform-filter">플랫폼</label>
        <select id="platform-filter" name="platform"><option value="">전체</option><option>wanted</option><option>remember</option><option>groupby</option><option>saramin</option><option>jobkorea</option><option>jumpit</option><option>offercent</option><option>greeting</option><option>private</option><option>headhunter</option></select>
        <label for="verdict-filter">스크리닝 판정</label>
        <select id="verdict-filter" name="screening_verdict"><option value="">전체</option><option value="null">미생성</option><option value="recommended">추천</option><option value="hold">보류</option><option value="not_recommended">비추천</option></select>
        <label for="application-filter">지원 상태</label>
        <select id="application-filter" name="application_status"><option value="">전체</option><option value="pending">대기</option><option value="applied">지원</option><option value="interview">면접</option><option value="offer">오퍼</option><option value="rejected">탈락</option></select>
        <label for="posting-filter">공고 상태</label>
        <select id="posting-filter" name="posting_status"><option value="">전체</option><option value="active">모집중</option><option value="closed">마감</option></select>
        <div class="form-actions">
          <button type="submit">검색</button>
          <button id="refresh-index" type="button">인덱스 갱신 후 검색</button>
        </div>
      </form>
      <p id="status" aria-live="polite"></p>
      <h2 id="results-heading" tabindex="-1">검색 결과</h2>
      <ul id="results"></ul>
      <nav id="pagination" class="hidden" aria-label="결과 페이지 이동">
        <button id="page-prev" type="button" disabled>&#9664; 이전</button>
        <span id="page-info"></span>
        <button id="page-next" type="button">다음 &#9654;</button>
      </nav>
    </section>
    <section class="detail-panel" aria-labelledby="detail-heading">
      <button id="back-to-results" type="button">검색 결과로 돌아가기</button>
      <h2 id="detail-heading" tabindex="-1">상세</h2>
      <div id="detail-meta"></div>
      <h3>JD 원문</h3><pre id="jd-content"></pre>
      <h3>스크리닝 결과</h3><pre id="screening-content"></pre>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
